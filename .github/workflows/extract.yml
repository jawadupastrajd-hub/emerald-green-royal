name: Extract project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o emerald-green-royal.zip -d /tmp/extracted
          SRC=/tmp/extracted
          if [ "$(ls -1 "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -1 "$SRC")" ]; then
            SRC="$SRC/$(ls -1 "$SRC")"
          fi
          echo "Extracting from: $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -f emerald-green-royal.zip
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "jawadupastrajd-hub"
          git config user.email "jawadupastrajd-hub@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract emerald-green-royal project files" || echo "Nothing to commit"
          git push
